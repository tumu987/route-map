  * { margin: 0; padding: 0; box-sizing: border-box; }

for (var i = 0; i < far.cities.length; i++) {
  var c = cityPosData[i], p = far.cities[i];
  if (p.leader) {
    ld.addLayer(L.circleMarker(p.orig, { radius: 4, color: p.color, weight: 2, fillColor: '#fff', fillOpacity: 1 }));
    ld.addLayer(L.polyline([p.orig, p.pos], { color: p.color, weight: 2, opacity: 0.5, dashArray: '5,4' }));
  }
  cityLite.addLayer(L.marker(p.pos, { icon: L.divIcon({ className: '', html: '<span style="color:'+c.color+';font-size:14px;font-weight:700;white-space:nowrap;text-shadow:0 0 4px #fff,0 0 8px #fff;">'+c.name+'</span>', iconSize: [20,20], iconAnchor: [10,10] }) }));
}
for (var i = 0; i < far.dxs.length; i++) {
  var d = far.dxs[i];
  dayLite.addLayer(L.marker(d.pos, { icon: L.divIcon({ className: '', html: '<div style="text-align:center;line-height:1.3;white-space:nowrap;"><div style="font-weight:700;font-size:12px;color:'+d.color+';text-shadow:0 0 4px #fff,0 0 8px #fff;">'+d.name+'</div></div>', iconSize: [40,16], iconAnchor: [20,8] }) }));
}

// Major POIs
for (var i = 0; i < majorSpots.length; i++) {
  var s = majorSpots[i];
  sp.addLayer(L.marker([s[0], s[1]], { icon: L.divIcon({ className: '', html: '<div style="display:flex;align-items:center;gap:3px;"><div style="width:6px;height:6px;background:'+s[2]+';border-radius:50%;flex-shrink:0;"></div><span style="font-size:12px;font-weight:700;color:'+s[2]+';white-space:nowrap;">'+s[3]+'</span></div>', iconSize: [40,28], iconAnchor: [s[4]+20, s[5]+14] }) }));
}
// Minor POIs
for (var i = 0; i < spots.length; i++) {
  var s = spots[i];
  sub.addLayer(L.marker([s[0], s[1]], { icon: L.divIcon({ className: '', html: '<div style="display:flex;align-items:center;gap:3px;"><div style="width:6px;height:6px;background:#3d7a4a;border-radius:50%;flex-shrink:0;"></div><span style="font-size:11px;font-weight:700;color:#3d7a4a;white-space:nowrap;">'+s[2]+'</span></div>', iconSize: [80,18], iconAnchor: [4,9] }) }));
}

// Zoom level handler
function u() {
  var z = map.getZoom();
  document.getElementById('zoom-display').textContent = 'Zoom ' + z;
  if (z < 9) {
    if (map.hasLayer(cityOv)) map.removeLayer(cityOv);
    if (map.hasLayer(dayOv)) map.removeLayer(dayOv);
    if (!map.hasLayer(cityLite)) map.addLayer(cityLite);
    if (!map.hasLayer(dayLite)) map.addLayer(dayLite);
    if (!map.hasLayer(ld)) map.addLayer(ld);
  } else {
    if (map.hasLayer(cityLite)) map.removeLayer(cityLite);
    if (map.hasLayer(dayLite)) map.removeLayer(dayLite);
    if (map.hasLayer(ld)) map.removeLayer(ld);
    if (!map.hasLayer(cityOv)) map.addLayer(cityOv);
    if (!map.hasLayer(dayOv)) map.addLayer(dayOv);
  }
  if (z >= 10) { if (!map.hasLayer(sp)) map.addLayer(sp); if (!map.hasLayer(su)) map.addLayer(su); } else { if (map.hasLayer(sp)) map.removeLayer(sp); if (map.hasLayer(su)) map.removeLayer(su); }
  if (z >= 11) { if (!map.hasLayer(sub)) map.addLayer(sub); } else { if (map.hasLayer(sub)) map.removeLayer(sub); }
}
map.on('zoom', u);
setTimeout(u, 100);
</script>
</body>
